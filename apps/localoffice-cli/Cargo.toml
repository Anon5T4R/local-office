[package]
name = "localoffice-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local Word command line: convert, inspect, render, run commands, MCP server"

[[bin]]
name = "localoffice-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
localoffice-doc = { workspace = true }
localoffice-engine = { workspace = true }
localoffice-render = { workspace = true }
localoffice-mcp = { workspace = true }
localoffice-zotero = { workspace = true }
# The suite's MCP plumbing: `--connect PORT` normalization (loopback only), as every Craft app.
craft-mcp = { workspace = true }
serde_json = { workspace = true }
sys-locale = "0.3"
