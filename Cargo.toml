[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["vendor", "libs"]
default-members = ["crates/*", "apps/localoffice", "apps/localoffice-cli", "xtask"]

[workspace.package]
version = "0.11.11"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Anon5T4R/local-office"

[workspace.dependencies]
# internal
localoffice-geom = { path = "crates/geom" }
localoffice-doc = { path = "crates/doc" }
localoffice-fonts = { path = "crates/fonts" }
localoffice-layout = { path = "crates/layout" }
localoffice-docx = { path = "crates/docx" }
localoffice-docbin = { path = "crates/docbin" }
localoffice-formats = { path = "crates/formats" }
localoffice-render = { path = "crates/render" }
localoffice-pdf = { path = "crates/pdf" }
localoffice-proof = { path = "crates/proof" }
localoffice-engine = { path = "crates/engine" }
localoffice-mcp = { path = "crates/mcp" }
localoffice-zotero = { path = "crates/zotero" }
localoffice-control-key = { path = "crates/control-key" }
localoffice-ui-egui = { path = "crates/ui-egui" }
localoffice-metafile = { path = "crates/metafile" }
localoffice-ai = { path = "crates/ai" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
unicode-script = "0.5"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "unicode"] }

# Desktop only: followed links are parsed before they reach the opener (#3732); already in the
# desktop tree through webbrowser and reqwest.
url = "2.5"

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
# WOFF / WOFF2 web fonts added by the user (#582): pure Rust (MIT); its brotli and zlib decoders
# (brotli-decompressor, flate2) are already in the tree.
wuff = "0.2.9"
# WOFF2's brotli stream, decoded ahead of wuff so its glyph point counts are checked first (#3703).
# The same crate and version wuff already decodes it with (no new code in the build): pure Rust,
# `forbid(unsafe_code)` in its default build, no_std-capable (builds for wasm), BSD-3-Clause/MIT.
brotli-decompressor = "5"
vello_cpu = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
# Vendored craft-libs (rev b926b5c03e256c86ca10934f58d03f628810b5b7) under libs/.
craft-pdf = { path = "libs/craft-libs/crates/pdf/", default-features = false, features = ["write"] }
craft-update = { path = "libs/craft-libs/crates/update/", features = ["egui"] }
# BYOK AI shared by the suite's apps (rev 7340a2ba7fc30952a4c2e8aa32210fde29a7a47c) under libs/:
# one OpenAI-compatible client for every provider, keys in the OS keychain. `crates/ai` gives it
# LocalOffice's identity (config folder, keychain service, OpenRouter headers).
local-ai = { path = "libs/local-ai" }
# Local STT via whisper.cpp (MIT) - model medium (769 MB) for quality transcription:
whisper-rs = "0.16"
# Cross-platform audio I/O for microphone capture (STT).
cpal = "0.18"
# Cross-platform data directory resolution for STT model storage.
dirs = "7"
# HTTP client for model download (pure Rust, no native deps).
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }
# zlib streams (compressed metafile pictures in `.doc` drawings); already in the lock as a dependency of other crates.
miniz_oxide = "0.9"
cfb = "0.15"
# Legacy text encodings (GBK/GB18030, Big5, Shift_JIS, EUC-KR, single-byte code pages) for plain
# text and CSV recipient lists (#778): encoding_rs ((Apache-2.0 OR MIT) AND BSD-3-Clause) and its
# detector chardetng (Apache-2.0 OR MIT), both pure Rust (Firefox's).
encoding_rs = "0.8"
chardetng = "1"
# Password-protected (agile-encrypted) Word documents: pure-Rust RustCrypto primitives.
aes = "0.9"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"
getrandom = "0.3"
zeroize = "1"
# Unix open flags (O_NONBLOCK for the engine's checked file reads, #3666); already in the lock as a
# dependency of other crates.
libc = "0.2"

# ui
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
# A monotonic clock that works on native and in the browser (`performance.now()`).
web-time = "1.1"
rfd = "0.17"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

# Line tables keep file and line in panics and backtraces; full debug info
# for every test binary and dependency would multiply the target dir size.
# The test profile inherits both settings.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# Vendored, patched third-party crates. The egui and winit crates resolve from the vendored
# forks under libs/ (path sources; egui 6d518fc799681571963842f95b55a6b68431b15a, winit
# a517b3846ee8457d84ee4975110bfda6797c44dc); krilla from craft-libs' own vendor tree.
[patch.crates-io]
krilla = { path = "libs/craft-libs/vendor/krilla/" }
ecolor = { path = "libs/egui/crates/ecolor/" }
emath = { path = "libs/egui/crates/emath/" }
epaint = { path = "libs/egui/crates/epaint/" }
epaint_default_fonts = { path = "libs/egui/crates/epaint_default_fonts/" }
egui = { path = "libs/egui/crates/egui/" }
egui-winit = { path = "libs/egui/crates/egui-winit/" }
egui-wgpu = { path = "libs/egui/crates/egui-wgpu/" }
egui_glow = { path = "libs/egui/crates/egui_glow/" }
egui_extras = { path = "libs/egui/crates/egui_extras/" }
egui_kittest = { path = "libs/egui/crates/egui_kittest/" }
egui_system_font_provider = { path = "libs/egui/crates/egui_system_font_provider/" }
eframe = { path = "libs/egui/crates/eframe/" }
egui_demo_lib = { path = "libs/egui/crates/egui_demo_lib/" }
egui_inspection = { path = "libs/egui/crates/egui_inspection/" }
winit = { path = "libs/winit/" }
