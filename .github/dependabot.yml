version: 2
updates:
  # Rust/Cargo dependencies are pinned by policy (local-deps/WORKFLOW.md): they change
  # only through the inventory + changelog flow, so no cargo ecosystem here.
  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
