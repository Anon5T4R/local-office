[package]
name = "localwriter-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local Writer import/export: plain text, Markdown, HTML, RTF, OpenDocument Text and LaTeX"

[lints]
workspace = true

[dependencies]
localwriter-doc = { workspace = true }
localwriter-geom = { workspace = true, features = ["image"] }
image = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
cfb = { workspace = true }
encoding_rs = { workspace = true }
chardetng = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
localwriter-doc = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
