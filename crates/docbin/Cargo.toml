[package]
name = "localoffice-docbin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LocalOffice reader for the Word 97-2003 binary file format (.doc, [MS-DOC])"

[lints]
workspace = true

[dependencies]
localoffice-doc = { workspace = true }
localoffice-geom = { workspace = true }
cfb = { workspace = true }
image = { workspace = true }
miniz_oxide = { workspace = true }
sha1 = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
localoffice-doc = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
serde_json = { workspace = true }
