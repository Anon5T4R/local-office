[package]
name = "localwriter-render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local Writer rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
localwriter-geom = { workspace = true, features = ["image"] }
localwriter-doc = { workspace = true }
localwriter-fonts = { workspace = true }
localwriter-layout = { workspace = true }
localwriter-metafile = { workspace = true }
vello_cpu = { workspace = true, features = ["multithreading"] }
image = { workspace = true }
log = { workspace = true }

