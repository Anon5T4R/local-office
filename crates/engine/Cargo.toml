[package]
name = "localwriter-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local Writer engine: session, selection, undo, the command registry (every action is a command), Word's command catalog, file I/O dispatch"

[lints]
workspace = true

[features]
# Front-end producer tests need to simulate a globally exhausted IME revision allocator. It only
# ever makes receipt classification fail closed. Never enable this for a production build; the
# UI's dev-dependencies enable it for its tests.
test-support = []

[dependencies]
localwriter-geom = { workspace = true, features = ["image"] }
localwriter-doc = { workspace = true }
localwriter-fonts = { workspace = true }
localwriter-layout = { workspace = true }
localwriter-render = { workspace = true }
localwriter-proof = { workspace = true }
localwriter-docx = { workspace = true }
localwriter-docbin = { workspace = true }
localwriter-pdf = { workspace = true }
localwriter-formats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
regex-automata = { workspace = true }
image = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true }

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK, so a path swapped for a named pipe can't block `open` (#3666).
libc = { workspace = true }

[dev-dependencies]
encoding_rs = { workspace = true }
zip = { workspace = true }
cfb = { workspace = true }
