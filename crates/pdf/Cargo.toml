[package]
name = "localoffice-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local Word PDF export (craft-pdf / Krilla): embedded font subsets with selectable text, links, outline, tagging"

[lints]
workspace = true

[dependencies]
localoffice-doc = { workspace = true }
localoffice-geom = { workspace = true, features = ["image"] }
localoffice-fonts = { workspace = true }
localoffice-layout = { workspace = true }
localoffice-metafile = { workspace = true }
craft-pdf = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
